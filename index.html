<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Print Service</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.10);
}

.logo {
    text-align: center;
    font-size: 42px;
    margin-bottom: 5px;
}

h1 {
    text-align: center;
    margin: 5px 0;
    color: #111827;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 16px;
    margin-bottom: 7px;
    color: #374151;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

input:focus,
select:focus {
    outline: none;
    border-color: #4f46e5;
}

.file-box {
    border: 2px dashed #818cf8;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    background: #f5f7ff;
}

.file-box input {
    border: none;
    padding: 5px;
}

.option-row {
    display: flex;
    gap: 10px;
}

.option {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
}

.option input {
    width: auto;
}

button {
    width: 100%;
    margin-top: 24px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.status {
    margin-top: 18px;
    padding: 13px;
    border-radius: 10px;
    text-align: center;
    display: none;
    font-weight: bold;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.info {
    background: #dbeafe;
    color: #1e40af;
}

.footer {
    text-align: center;
    margin-top: 22px;
    font-size: 15px;
    font-weight: bold;
    background: linear-gradient(90deg, #ef4444, #7c3aed, #2563eb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.note {
    font-size: 12px;
    color: #6b7280;
    margin-top: 6px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">🖨️</div>

<h1>QR Print Service</h1>

<div class="subtitle">
Upload your document and send it for printing
</div>

<form id="printForm">

<label>🔐 Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter password"
    required
>


<label>📁 Select File</label>

<div class="file-box">

<input
    type="file"
    id="file"
    accept=".jpg,.jpeg,.png,.pdf"
    required
>

<div class="note">
JPG, PNG or PDF • Maximum 20 MB
</div>

</div>


<label>🖨️ Colour</label>

<div class="option-row">

<div class="option">
<label>
<input
    type="radio"
    name="color"
    value="color"
    checked
>
Colour
</label>
</div>

<div class="option">
<label>
<input
    type="radio"
    name="color"
    value="bw"
>
B&W
</label>
</div>

</div>


<label>📄 Printing Side</label>

<select id="printSide">

<option value="single">
Single Side
</option>

<option value="double" disabled>
Double Side — Coming Soon
</option>

</select>


<label>📑 PDF Pages</label>

<select id="pages">

<option value="all">
All Pages
</option>

<option value="1">
Page 1
</option>

<option value="1,2">
Pages 1,2
</option>

<option value="1,3">
Pages 1,3
</option>

<option value="custom">
Custom / Range
</option>

</select>

<input
    type="text"
    id="customPages"
    placeholder="Example: 1,3,5 or 1-5"
    style="display:none;margin-top:10px;"
>


<button
    type="submit"
    id="uploadButton"
>
🚀 Upload & Print
</button>

</form>

<div
    id="status"
    class="status"
></div>

<div class="footer">
Designed & Coding By D K Pal
</div>

</div>

</div>


<script>

const API_URL =
"https://ykxgnaynbkwtqnwksloh.supabase.co/functions/v1/smooth-api";


const form =
document.getElementById("printForm");

const fileInput =
document.getElementById("file");

const pagesSelect =
document.getElementById("pages");

const customPages =
document.getElementById("customPages");

const button =
document.getElementById("uploadButton");

const statusBox =
document.getElementById("status");



pagesSelect.addEventListener("change", function() {

    if (this.value === "custom") {

        customPages.style.display = "block";

    } else {

        customPages.style.display = "none";

    }

});



function showStatus(message, type) {

    statusBox.style.display = "block";

    statusBox.className =
        "status " + type;

    statusBox.innerText =
        message;

}



form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const password =
        document.getElementById("password").value.trim();


    const file =
        fileInput.files[0];


    const colorMode =
        document.querySelector(
            'input[name="color"]:checked'
        ).value;


    const printSide =
        document.getElementById("printSide").value;


    let pages =
        pagesSelect.value;


    if (pages === "custom") {

        pages =
            customPages.value.trim();

        if (!pages) {

            showStatus(
                "Please enter PDF pages.",
                "error"
            );

            return;
        }
    }


    if (!file) {

        showStatus(
            "Please select a file.",
            "error"
        );

        return;
    }


    if (file.size > 20 * 1024 * 1024) {

        showStatus(
            "File size must be less than 20 MB.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.innerText =
        "⏳ Uploading...";


    showStatus(
        "Uploading your file...",
        "info"
    );


    try {

        const formData =
            new FormData();


        formData.append(
            "password",
            password
        );


        formData.append(
            "file",
            file
        );


        formData.append(
            "color_mode",
            colorMode
        );


        formData.append(
            "print_side",
            printSide
        );


        formData.append(
            "pages",
            pages
        );


        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",
                    body: formData
                }
            );


        const result =
            await response.json();


        if (!response.ok || !result.success) {

            throw new Error(
                result.error ||
                "Upload failed."
            );
        }


        showStatus(
            "✅ File received successfully! Your print is being processed.",
            "success"
        );


        form.reset();

        customPages.style.display =
            "none";


    } catch (error) {

        console.error(error);


        showStatus(
            "❌ " + error.message,
            "error"
        );


    } finally {

        button.disabled = false;

        button.innerText =
            "🚀 Upload & Print";

    }

});

</script>

</body>
</html>
